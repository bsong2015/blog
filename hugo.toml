baseURL = 'https://bsong2015.github.io/blog/'
languageCode = "zh-CN"          # 设置默认语言为简体中文
defaultContentLanguage = "zh"   # 内容默认语言标识（与多语言配置匹配）
title = "万年水的博客"
theme = ["PaperMod"]

[params]
  defaultTheme = "auto"
  disableSpecial1stPost = true
  
  [params.author]
    name = "万年水"
    email = ""

# 配置中文语言细节（可选但推荐）
[languages.zh]
languageName = "中文"
weight = 1                      # 权重，用于多语言排序
  
[frontmatter]
  slug = ":filename"

[security]
  fileGetDir = "content/**"  # 显式允许中文路径

